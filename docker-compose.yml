services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-app
    restart: unless-stopped
    # Load JWT_SECRET, PORT, etc. from your .env file...
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment
      # Inside the network RabbitMQ is at host "rabbitmq", not localhost.
      RABBITMQ_URL: amqp://payment:payment@rabbitmq:5672
      NODE_ENV: development
      # Tracing: which service these spans belong to, and where to send them.
      OTEL_SERVICE_NAME: payment-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: payment-rabbitmq
    restart: unless-stopped
    environment:
      # guest is blocked from non-localhost connections, so we set our own user.
      RABBITMQ_DEFAULT_USER: payment
      RABBITMQ_DEFAULT_PASS: payment
    ports:
      - "5672:5672" # AMQP protocol (the app talks here)
      - "15672:15672" # management web UI (you browse here)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The webhook worker: same image as the app, but runs the worker entrypoint
  # instead of the server. Shares the database; reaches the app over the Docker
  # network at http://app:3000. This separate process IS the decoupling.
  # Legacy Postgres-polling worker, kept for reference. It's behind a compose
  # PROFILE so `docker compose up` does NOT start it — otherwise it would drain
  # the same outbox as rabbit-worker and double-deliver. To run it deliberately:
  #   docker compose --profile polling up -d worker
  worker:
    profiles: ["polling"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-worker
    restart: unless-stopped
    command: npm run worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment
      SERVICE_NAME: webhook-worker
      NODE_ENV: development
      OTEL_SERVICE_NAME: webhook-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

  # RabbitMQ-based webhook worker (relay + consumer). Run this INSTEAD of the
  # plain `worker` above — both drain the same outbox, so running both would
  # deliver each event twice.
  rabbit-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-rabbit-worker
    restart: unless-stopped
    command: npm run rabbit:worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment
      RABBITMQ_URL: amqp://payment:payment@rabbitmq:5672
      SERVICE_NAME: rabbit-worker
      NODE_ENV: development
      OTEL_SERVICE_NAME: rabbit-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

  # Scheduled settlement worker: sweeps merchant wallet balances into payouts and
  # sends them to the bank (simulated). Separate process, same image.
  settlement-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-settlement-worker
    restart: unless-stopped
    command: npm run settlement:worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment
      SERVICE_NAME: settlement-worker
      NODE_ENV: development
      OTEL_SERVICE_NAME: settlement-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

  postgres:
    image: postgres:16
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      # host:container -> we reach it at localhost:5432
      - "5432:5432"
    volumes:
      # keeps data alive even if the container restarts
      - payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: payment-pgadmin
    restart: unless-stopped
    environment:
      # These are the login for the pgAdmin web UI itself (not the database).
      PGADMIN_DEFAULT_EMAIL: psalmsgus99@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Skips a first-run wizard so it starts up cleaner.
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # We open pgAdmin's web UI on localhost:5050 (its container listens on 80).
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - payment_pgadmin:/var/lib/pgadmin

  prometheus:
    image: prom/prometheus:latest
    container_name: payment-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - payment_prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI (check scrape targets, run PromQL)

  otel-collector:
    # contrib image — the core collector does NOT include tail_sampling.
    image: otel/opentelemetry-collector-contrib:latest
    container_name: payment-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    # No host ports needed — the apps reach it over the Docker network at
    # otel-collector:4318, and it forwards to jaeger internally.
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: payment-jaeger
    restart: unless-stopped
    environment:
      # Enable the OTLP receivers (gRPC 4317 / HTTP 4318) so our app can ship
      # spans straight to Jaeger without a separate collector.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI (the trace waterfall view)
      - "4318:4318" # OTLP/HTTP receiver (our app posts spans here)

  alertmanager:
    image: prom/alertmanager:latest
    container_name: payment-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093" # Alertmanager UI (see active alerts, silences)

  grafana:
    image: grafana/grafana:latest
    container_name: payment-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - payment_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000" # Grafana UI on localhost:3001 (3000 is our API)
    depends_on:
      - prometheus

volumes:
  payment_pgdata:
  payment_pgadmin:
  payment_prometheus_data:
  payment_grafana_data:
