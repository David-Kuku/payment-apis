services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-app
    restart: unless-stopped
    # Load JWT_SECRET, PORT, etc. from your .env file...
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment
      # Inside the network RabbitMQ is at host "rabbitmq", not localhost.
      RABBITMQ_URL: amqp://payment:payment@rabbitmq:5672
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: payment-rabbitmq
    restart: unless-stopped
    environment:
      # guest is blocked from non-localhost connections, so we set our own user.
      RABBITMQ_DEFAULT_USER: payment
      RABBITMQ_DEFAULT_PASS: payment
    ports:
      - "5672:5672" # AMQP protocol (the app talks here)
      - "15672:15672" # management web UI (you browse here)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The webhook worker: same image as the app, but runs the worker entrypoint
  # instead of the server. Shares the database; reaches the app over the Docker
  # network at http://app:3000. This separate process IS the decoupling.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-worker
    restart: unless-stopped
    command: npm run worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment
      SERVICE_NAME: webhook-worker
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

  # RabbitMQ-based webhook worker (relay + consumer). Run this INSTEAD of the
  # plain `worker` above — both drain the same outbox, so running both would
  # deliver each event twice.
  rabbit-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-rabbit-worker
    restart: unless-stopped
    command: npm run rabbit:worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://payment:payment@postgres:5432/payment
      RABBITMQ_URL: amqp://payment:payment@rabbitmq:5672
      SERVICE_NAME: rabbit-worker
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

  postgres:
    image: postgres:16
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      # host:container -> we reach it at localhost:5432
      - "5432:5432"
    volumes:
      # keeps data alive even if the container restarts
      - payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: payment-pgadmin
    restart: unless-stopped
    environment:
      # These are the login for the pgAdmin web UI itself (not the database).
      PGADMIN_DEFAULT_EMAIL: psalmsgus99@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Skips a first-run wizard so it starts up cleaner.
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      # We open pgAdmin's web UI on localhost:5050 (its container listens on 80).
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - payment_pgadmin:/var/lib/pgadmin

volumes:
  payment_pgdata:
  payment_pgadmin:
