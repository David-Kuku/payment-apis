# DEMO config (used only by docker-compose.replicas.yml). Identical to
# prometheus.yml but scrapes THREE app instances so you can see the `instance`
# label split time series per replica.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      # Each target becomes a distinct `instance` label: app:3000, app2:3000,
      # app3:3000. One Prometheus, one job, three instances.
      - targets: ["app:3000", "app2:3000", "app3:3000"]
